services:
  - type: web
    name: adabi-khazana-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: CHANNEL_USERNAME
        value: pashto_Novel
      - key: PUBLIC_BASE_URL
        sync: false
